# Blueprint do Render: Quadro + banco Postgres próprio.
# No Render: New > Blueprint > escolher este repositório.
services:
  - type: web
    name: quadro
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        fromDatabase:
          name: quadro-db
          property: connectionString

databases:
  - name: quadro-db
    plan: free
    databaseName: quadro
